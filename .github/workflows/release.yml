name: release

# 发布纪律（对齐 references/ci-pipeline-template.md §3.6 / §5 / §6 / §8）：
#   tag → 全量 smoke → **发布预检（参数/产物/资产契约）** → 确定性打包（zip + SHA256SUMS +
#   PROVENANCE + manifest）→ SBOM → 校验和回验 → GitHub Release（7 资产）
#
# 发版前本地三步（缺一步就会把红带到 tag 上，2026-11-05 实测）：
#   ① GK_SELFCHECK_TESTS=full python scripts/gk_self_check.py
#   ② python scripts/gk_release_preflight.py
#   ③ python scripts/oss_scrub.py export --out <dir>   # 导出树内自动重跑 ②
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "待打包的 tag（workflow_dispatch 用）"
        required: true
        default: ""

# 最小权限：workflow 默认只读；发布 job 单独申请 contents/id-token/attestations。
permissions:
  contents: read

# 运行时基线（2026-11-02）：Actions 已弃用 Node 20，默认强制 Node 24；
# runner 侧固定 `ubuntu-24.04`（`ubuntu-latest` 已于 2026-10 起迁 Ubuntu 26，
# 发布打包不应随基础镜像语义漂移）。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: package + verify + publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # 单人维护：不设 environment required reviewers —— GitHub 不允许触发者审批自己的部署，
    # 配了会永久等待。tag push / workflow_dispatch 本身就是人工闸门。
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: install test deps
        # 2026-11-08：`openai-agents` 钉在 `subagent_runner.py` 声明的区间 `>=0.22,<0.24`
        #   （不钉时 runner 的 0.24.0 会让角色/工具面测试 `SUAGENT_SDK_VERSION_MISMATCH` 退出 2，
        #   连带 release 的 smoke gate 恒红）。上游 0.24 修复 DeepSeek 400 后再放宽。
        run: python -m pip install --upgrade pip pytest pytest-xdist cryptography pyyaml==6.0.2 openai "openai-agents>=0.22,<0.24" pydantic
      - name: workflow security gate
        run: python scripts/gk_ci_security_lint.py --json
      - name: package/hook integrity
        # 发布前最后一道注册面检查：命令 / 插件 / 钩子注册了就必须有载体。
        run: python scripts/gk_package_integrity.py --json
      - name: smoke gate
        run: bash scripts/ci_smoke.sh
      - name: resident feature coverage (self-description)
        # 发布面门禁：常驻功能必须在自述文档得到反映，自动刷新文档不得漂移。
        run: python scripts/gk_doc_features.py
      - name: release preflight (contract + fixture + docs + assets)
        # 2026-11-04：把「workflow ↔ 脚本参数契约 / PROVENANCE 产出 / 7 个发布资产」
        # 变成**打包前**的 fail-loud 判据。事故：v0.9.6.8–v0.9.6.10 连续三版
        # 在 pack 步 argparse 退出 2（workflow 传 --source-*，脚本不认），
        # 而 publish 要求的 dist/PROVENANCE.json 从未产出。
        run: python scripts/gk_release_preflight.py
      - name: archive preflight (offline + Zenodo dry-run)
        # 发包预检（**阻断**）：先离线校验 archive.json，再解析 Concept DOI 到 Zenodo 最新记录。
        # 解析不到就不发包 —— 避免「发布后才发现归档失败、再补一版」。
        # 只读：dry-run 不发写请求；pack 之前附件尚未产出，故允许 missing。
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ZENODO_TOKEN: ${{ secrets.ZTHL }}
        run: |
          python scripts/gk_zenodo_sync.py --check-archive references/archive.json
          CONCEPT=$(python -c "import json;print(json.load(open('references/archive.json'))['concept_doi'].rsplit('.',1)[-1])")
          python scripts/gk_zenodo_sync.py --concept "$CONCEPT" --version "$VERSION" --dist dist --dry-run
      - name: pack (deterministic zip + SHA256SUMS + PROVENANCE + manifest)
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python scripts/pack_release.py --tree . --out dist --version "$VERSION" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-tag "$VERSION" \
            --json > pack-report.json
          cat pack-report.json
      - name: sbom (CycloneDX 1.5)
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ZIP_SHA=$(sha256sum "dist/zthl-aegis-$VERSION.zip" | cut -d' ' -f1)
          python scripts/gk_sbom.py --tree . --version "$VERSION" \
            --zip-sha256 "$ZIP_SHA" --out dist/SBOM.cdx.json
          cat dist/SBOM.cdx.json
      - name: verify checksums (extract + sha256sum -c)
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/unpacked
          unzip -q "dist/zthl-aegis-$VERSION.zip" -d dist/unpacked
          cd dist/unpacked
          sha256sum -c SHA256SUMS
      - name: release-gate benchmark (SLA record)
        # S5：发布门耗时纳入 SLA —— 只记录与 WARN（CI 抖动大），不阻断发版；
        #   基线滚动由维护者按 nightly 产物人工 `--init-baseline`。
        # 2026-11-04：公开树只导出 references 子集，doc-release --strict 必然报「文件缺失」
        #   （私有面文档未随包）⟹ 该步只记录 rc/耗时，不阻断发布。
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p dist/bench
          python scripts/gk_bench_release.py --json --out-dir dist/bench > dist/bench/release.json || true
          python scripts/gk_bench_compare.py --baseline references/bench-baseline.json \
            --release dist/bench/release.json --only release --json \
            | tee dist/bench/release-compare.json
      - name: attest build provenance
        # SLSA provenance：把 zip 与本次 workflow/commit 绑定，消费方可离线核验。
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: |
            dist/zthl-aegis-*.zip
            dist/SBOM.cdx.json
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          NOTES=(--generate-notes)
          [ -f "RELEASE-NOTES/RELEASE-NOTES-$VERSION.md" ] && NOTES=(--notes-file "RELEASE-NOTES/RELEASE-NOTES-$VERSION.md")
          # 7 个资产 = 5 核心 + 2 基准；基准步 continue-on-error，缺失则降级为 5 个（不静默造假）。
          ASSETS=(
            "dist/zthl-aegis-$VERSION.zip"
            "dist/SHA256SUMS"
            "dist/PROVENANCE.json"
            "dist/SBOM.cdx.json"
            "dist/release-manifest.json"
          )
          for f in dist/bench/release.json dist/bench/release-compare.json; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          echo "release assets: ${#ASSETS[@]}"
          gh release create "$VERSION" --verify-tag "${ASSETS[@]}" \
            --title "ZTHL Aegis $VERSION" "${NOTES[@]}"
      - name: archive to Zenodo (new version)
        # 每个 Release 自动归档为 Zenodo 新版本（Concept DOI 自动指向最新）：
        #   未配置 token 时脚本自行跳过（exit 0，属**配置态**而非失败）。
        #   ⚠ 不得 `continue-on-error`：`ci-pipeline-template.md` §7.1/§8 明确「吞失败 = 假绿 = 无防御」，
        #     2026-11-04 v0.9.6.5 就因它把 `403 Bucket is locked` 藏成了绿色作业。
        # Concept recid 取自包内 `references/archive.json` 的 Concept DOI（单一事实源）。
        # 仓库 secret 名为 `ZTHL`（2026-11-04 建立），脚本仍读环境变量 ZENODO_TOKEN。
        env:
          ZENODO_TOKEN: ${{ secrets.ZTHL }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          CONCEPT=$(python -c "import json;print(json.load(open('references/archive.json'))['concept_doi'].rsplit('.',1)[-1])")
          python scripts/gk_zenodo_sync.py --concept "$CONCEPT" --version "$VERSION" --dist dist

  sync-main:
    name: sync main to latest tag
    # 发布纪律（2026-11-04 修订，用户裁定「按方案改规则」）：
    #   **tag 必须是 main 的祖先**。main 领先 tag 是**正常状态**（存在未发版提交），
    #   不再因此强制补发版本——旧规则「main 必须等于最新 tag」会逼出连环发版。
    #   - tag 比 main 新（tag 打在侧支/游离提交上，main 落后）⟹ **快进** main 到 tag（真正的异常）；
    #   - main 比 tag 新 ⟹ 只在 job summary 记录「未发版 N 个提交」，不改写历史、不判失败；
    #   - 已分叉 ⟹ 失败，交人工处理。
    # 注意：GITHUB_TOKEN 推 main 不会触发其他 workflow —— 这里快进到的提交正是 tag 提交，
    #   其 CI 已在 tag 上跑过，无需再触发。
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fast-forward main / report drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          MAIN_SHA=$(git rev-parse origin/main)
          echo "tag=$TAG ($TAG_SHA)  main=$MAIN_SHA"

          if [ "$TAG_SHA" = "$MAIN_SHA" ]; then
            echo "main 已与 $TAG 同步"
            echo "main 已与 \`$TAG\` 同步（\`$TAG_SHA\`）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA"; then
            AHEAD=$(git rev-list --count "$TAG_SHA..$MAIN_SHA")
            # 新规则：main 领先 = 正常（有未发版提交），只记录，不告警、不判失败
            echo "main 领先 $TAG $AHEAD 个提交（未发版，属正常状态）"
            {
              echo "### main 领先 \`$TAG\` $AHEAD 个提交（未发版，属正常状态）"
              echo '```'
              git log --oneline "$TAG_SHA..$MAIN_SHA"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git merge-base --is-ancestor "$MAIN_SHA" "$TAG_SHA"; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$TAG_SHA:refs/heads/main"
            echo "main 已快进到 $TAG（$TAG_SHA）"
            echo "main 已快进到 \`$TAG\`（\`$TAG_SHA\`）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::main 与 $TAG 已分叉，需人工处理"
