name: release

# 发布纪律（对齐 references/ci-pipeline-template.md §3.6 / §5 / §6）：
#   tag → 全量 smoke → 确定性打包 → 校验和回验 → GitHub Release（附 zip + manifest + SHA256SUMS）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "待打包的 tag（workflow_dispatch 用）"
        required: true
        default: ""

permissions:
  contents: write

# 运行时基线（2026-11-02）：Actions 已弃用 Node 20，默认强制 Node 24；
# runner 侧固定 `ubuntu-24.04`（`ubuntu-latest` 已于 2026-10 起迁 Ubuntu 26，
# 发布打包不应随基础镜像语义漂移）。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: package + verify + publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test deps
        run: python -m pip install --upgrade pip pytest pytest-xdist cryptography
      - name: smoke gate
        run: bash scripts/ci_smoke.sh
      - name: pack (deterministic zip + SHA256SUMS + manifest)
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python scripts/pack_release.py --tree . --out dist --version "$VERSION" --json > pack-report.json
          cat pack-report.json
      - name: verify checksums (extract + sha256sum -c)
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/unpacked
          unzip -q "dist/zthl-aegis-$VERSION.zip" -d dist/unpacked
          cd dist/unpacked
          sha256sum -c SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "dist/zthl-aegis-$VERSION.zip" \
            "dist/SHA256SUMS" \
            "dist/release-manifest.json" \
            --title "ZTHL Aegis $VERSION" \
            --generate-notes
