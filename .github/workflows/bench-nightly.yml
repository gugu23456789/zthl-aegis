name: bench-nightly

# S5（M5）：full 基准夜间跑 → 与 `references/bench-baseline.json` 对比 → 产物留档。
# 纪律：
#   · **跨环境**（Windows 基线 vs ubuntu runner）只做硬失败门（失败写 / 崩溃残留 / 场景 ok），
#     ratio（写放大、p99）降级为 WARN —— 跨 OS 的数字不可直接比较；
#   · 基线**只新增版本/人工更新**，CI 不自动改基线（自动改写会让门禁变成自证）；
#   · full 结果与对比 JSON 全量上传，供下一版本人工复核后 `--init-baseline` 滚动。
on:
  schedule: [{cron: "0 19 * * *"}]        # UTC 19:00 = Asia/Shanghai 03:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-nightly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 供应链（2026-11-08）：只装 wheel、不回连 pip 自更新（同 ci.yml）。
  PIP_ONLY_BINARY: ":all:"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  full:
    name: full benchmarks + baseline compare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install test deps (pinned)
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: full benchmarks
        run: |
          mkdir -p dist/bench
          python scripts/gk_bench_state.py --full --json --out-dir dist/bench
          python scripts/gk_bench_satellite.py --full --json --out-dir dist/bench
          python scripts/gk_bench_gate.py --full --json --out-dir dist/bench
          python scripts/gk_bench_release.py --json --out-dir dist/bench
      - name: compare vs committed baseline
        run: |
          set -o pipefail
          python scripts/gk_bench_compare.py --baseline references/bench-baseline.json \
            --state dist/bench/gk_bench_state-full.json \
            --satellite dist/bench/gk_bench_satellite-full.json \
            --gate dist/bench/gk_bench_gate-full.json \
            --release dist/bench/gk_bench_release.json \
            --no-ratio --json | tee dist/bench/compare.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: bench-full
          path: dist/bench/
          retention-days: 30
