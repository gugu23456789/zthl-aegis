name: ci

# 最小权限：CI 只读仓库；写权限只留给 release workflow。
permissions:
  contents: read

on:
  push:
  pull_request:
  # 2026-11-05（红队常态化）：密钥泄露向量每周一跑一次 —— 不只靠「改代码那次」记得跑。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      plan:
        description: "待质询计划路径（plan_lint = 质询前置 pw-sn 安全网；留空跳过）"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 运行时基线（2026-11-02）：Actions 已弃用 Node 20，默认强制 Node 24；
# runner 侧固定 `ubuntu-24.04` —— `ubuntu-latest` 在 2026-10 起迁 Ubuntu 26，
# 语义漂移会改变 apt/glibc 行为，发布门不该跟着漂。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 供应链（2026-11-08）：只装 wheel —— sdist 的 build 阶段是 `setup.py`/PEP517 钩子
  #   投毒的入口（装源码包 = 允许任意代码在装依赖时就执行）。本仓所需依赖均有 wheel。
  PIP_ONLY_BINARY: ":all:"
  # 不回连 pip 自更新：`--upgrade pip` 等于在 CI 里装一个**未钉版本**的 pip，
  #   供应链根节点裸奔（runner 镜像自带的 pip 已由镜像版本固定）。
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  smoke:
    name: smoke (syntax / plan-lint / fast tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install test deps
        # cryptography：身份认证验签 / Ed25519 封印用例的**真跑**依赖。缺它时相关测试
        # 只能 importorskip（覆盖归零）；装上才守得住验签路径。
        # 供应链（2026-11-08）：依赖单一事实源 = `requirements-ci.txt`（全 `==` 钉死）。
        #   原内联 `--upgrade pip pytest ... "openai-agents>=0.22,<0.24"` 有两个问题：
        #   ① 浮动范围在 runner 上解析到 0.23.1，本地/生产是 0.22.0 ⟹ CI 测的 SDK ≠ 生产；
        #   ② 未钉的 pytest/cryptography/pip 都是投毒面（`PIP_ONLY_BINARY` 再挡 sdist 钩子）。
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: smoke gate
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci_smoke.sh
      - name: inline payload gate (ratchet)
        # N-1（2026-11-04）：内联载荷**只降不升**。
        #   ① 基线冻结入库（docs/analysis/bomb-inventory-20261104.json）⟹ 只报 NEW，防「自证循环」；
        #   ② --max-payload 是硬棘轮：拆块后才许调低，禁止无对应拆解提交时调高。
        #   2026-11-05：cmd_monitor 两处 ECC 信封块下沉（validate/hmac，4.7 KB）⟹ 96 → 88。
        #   2026-11-05 二修：基线文件在 `docs/`（导出排除面）⟹ 公开树**必然缺失**，
        #     原无条件 `--assert-baseline` 使公开 CI 恒红；改为存在才比对，硬棘轮照常执行。
        run: |
          BASELINE=docs/analysis/bomb-inventory-20261104.json
          if [ -f "$BASELINE" ]; then
            python scripts/gk_bomb_inventory.py --assert-baseline "$BASELINE"
          else
            echo "(skip baseline assert: $BASELINE 不随公开包导出；硬上限仍由下一条守住)"
          fi
          python scripts/gk_bomb_inventory.py --max-payload 88

  preflight:
    # 2026-11-04：把发布契约放到**日常 CI** 拦，而不是等 tag 推上去才炸。
    #   事故：v0.9.6.8–v0.9.6.10 三版发版失败（workflow 传 --source-*，脚本不认；
    #   publish 要 PROVENANCE.json 却从未产出）——这类跨文件漂移必须在 push/PR 阶段红。
    name: preflight (release contracts / docs / package integrity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: release preflight (fail-loud)
        # ① 参数契约 ② 夹具打包四件套 ③ 事实块 ④ 覆盖门 ⑤ 7 个资产挂载点
        run: python scripts/gk_release_preflight.py
      - name: package/hook integrity
        run: python scripts/gk_package_integrity.py --json

  red-keyleak:
    # 2026-11-05（红队常态化）：密钥泄露向量 —— argv / xtrace / shell history / 日志面 / 排除面。
    #   纯静态 + 离线（0 依赖），push/PR 与每周 cron 各跑一次；HIGH 命中即红。
    #   新增泄密面（新的 curl、新的日志写点）时，同步在脚本里加向量 —— 见脚本头 docstring。
    name: red-keyleak (key leakage vectors)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: key leakage vectors
        run: python3 scripts/gk_red_keyleak.py

  venv-gate:
    # 2026-11-02 owner 要求：CI 必须在内置虚拟环境里完整跑一遍。
    # 背景：package-integrity 曾因「跑 pytest 却没装 pytest」整 job 假红；
    # 依赖 runner 自带 site-packages 的写法不可审计。这里从零建 venv、装依赖，
    # 再跑 smoke 门 + 可移植测试集，证明公开树在隔离解释器下自洽。
    name: venv (isolated interpreter)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: create venv + install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements-ci.txt
      - name: assert interpreter is the venv
        run: |
          . .venv/bin/activate
          test "$(command -v python)" = "$PWD/.venv/bin/python"
          python -c "import sys; print('prefix =', sys.prefix)"
      - name: smoke gate in venv
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          . .venv/bin/activate
          bash scripts/ci_smoke.sh
      - name: portable suites in venv
        shell: bash
        run: |
          . .venv/bin/activate
          python -m pytest -q \
            scripts/test_pack_release.py \
            scripts/test_py_resolve.py \
            scripts/test_opcap_evidence_alias.py \
            scripts/test_gk_package_integrity.py \
            scripts/test_gk_hook_manage.py

  bench-quick:
    # S5（M5）：benchmark 门禁化的 CI 半边 —— 正确性（quick 跑通）+ 阈值（红先转绿）。
    # full / 夜间基线与跨版本对比在 bench-nightly.yml；本 job 只花 ~1 分钟。
    name: benchmark quick (correctness + thresholds)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install test deps
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: quick bench (correctness)
        run: python scripts/gk_bench_state.py --quick --json
      - name: red-first thresholds + baseline comparator
        run: python -m pytest -q scripts/test_gk_bench_thresholds.py scripts/test_gk_bench_compare.py

  plan-gate:
    # plan_lint 是**计划质询前置 pw-sn 安全网**（针对本轮要质询的那份计划），
    # 不是仓库级文档 lint ⟹ 不进 push/PR 常规门，只按手填路径触发。
    name: plan-lint (pw-sn pre-gate)
    if: github.event_name == 'workflow_dispatch' && inputs.plan != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: plan linter
        env:
          # 输入经 env 中转：禁止把 `inputs.*` 直接插进 run（模板注入）。
          PLAN: ${{ inputs.plan }}
        run: python scripts/gk_plan_lint.py "$PLAN"

  full:
    # 全量回归依赖 WSL/9p 语义、审计密钥与既有失败基线（_accept_baseline.txt 绑定解释器），
    # 因此只在自托管 runner 上手动触发；普通 PR 不跑。
    name: full regression (self-hosted WSL)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: acceptance suite
        env:
          # 解释器可经仓库变量覆盖；**缺省 = `python3`**（公开面不写死个人 venv 路径）。
          ACCEPT_PY: ${{ vars.ACCEPT_PY || 'python3' }}
        run: bash scripts/_accept_cli.sh --full

  platform-smoke:
    # 跨平台编译/快速测试（2026-11-02 新增）。**观察期**：Windows 腿 continue-on-error，
    # 连续 3 轮稳定后再转硬门（owner：先在 linux 必过、windows 只报不拦）。
    name: platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install test deps
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: shell syntax
        shell: bash
        run: bash -n gatekeeper-cli.sh
      - name: python compile (tracked)
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys, py_compile
          files = subprocess.check_output(["git", "ls-files", "scripts/*.py"], text=True).splitlines()
          bad = []
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except Exception as e:
                  bad.append((f, str(e)))
          print("compiled=%d failed=%d" % (len(files), len(bad)))
          for f, e in bad[:5]:
              print("FAIL", f, e)
          sys.exit(1 if bad else 0)
          PY
      - name: fast tests
        shell: bash
        run: python -m pytest -q scripts/test_pack_release.py scripts/test_py_resolve.py scripts/test_opcap_evidence_alias.py

  package-integrity:
    # 包 / 钩子完整性（2026-11-02 新增）：注册面（命令 / 插件 / 钩子）必须有对应载体。
    # 三类缺件：命令注册了没函数、插件登记了没内置源、安装器注册钩子却没 wrapper。
    name: package + hook integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install test deps
        # 2026-11-02 CI 修复：本 job 跑 pytest，但原先没装 pytest ⟹
        #   `python -m pytest` 直接 "No module named pytest"（exit 1），不是测试失败。
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: integrity scan
        run: python scripts/gk_package_integrity.py --json
      - name: hook / integrity tests
        run: python -m pytest -q scripts/test_gk_package_integrity.py scripts/test_gk_hook_manage.py
      - name: install/uninstall round-trip
        shell: bash
        run: |
          tmp=$(mktemp -d)
          bash install.sh --dest "$tmp/skill" --no-hooks
          bash uninstall.sh --dest "$tmp/skill" --yes
          if [ -e "$tmp/skill" ] && [ -n "$(ls -A "$tmp/skill" 2>/dev/null)" ]; then
            echo "leftover after uninstall:"
            find "$tmp/skill" -maxdepth 3
            exit 1
          fi

  security-audit:
    # workflow 供应链 + 危险命令静态扫描（2026-11-02 新增；本地静态门为硬门，
    # actionlint 仅在 runner 已安装时执行）。
    name: security audit (static)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # job 级权限：SARIF 上报需要 security-events: write；顶层仍是 contents: read。
    # job 级 permissions 会**整体替换**顶层声明，故 contents: read 必须在此重复。
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install lint deps (pinned)
        # zizmor 亦为 PyPI 依赖 ⟹ 同样钉死版本；本 job 只读（contents: read），
        #   即使被投毒也不持写权限（写权限只在 release job）。
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: workflow supply-chain audit (zizmor)
        # 模板 §4/§8：`|| true` 或 continue-on-error = 无防御 ⟹ 这里真实失败。
        # 覆盖面：未钉 uses / 模板注入 / 过宽权限 / cache-poisoning / artipacked 等
        #   （custom 的 gk_ci_security_lint 只覆盖本仓自定的 6+1 条，zizmor 补上游语义）。
        run: zizmor --format plain --min-severity medium .github/workflows/
      - name: workflow security gate
        # 最小权限 / SHA pin / persist-credentials / timeout / run 注入。
        run: python scripts/gk_ci_security_lint.py --json
      - name: bash dangerous-command static scan
        run: |
          # 2026-11-04：原步骤只 `--json`（该形态恒 exit 0）⟹ 命中危险命令也不红，
          # 属装饰性步骤（对齐模板 §7.1 假绿红线）。先跑门禁形态（issues>0 ⟹ exit 1），
          # 再落 JSON 供 artifact 消费。
          python scripts/gk_bash_static_scan.py
          python scripts/gk_bash_static_scan.py --json > static-scan.json
          cat static-scan.json | head -c 2000
      - name: SARIF (unified static results)
        # 三份私有 JSON 归一为 SARIF 2.1.0；--gate 使「存在 error 级 finding」真实失败。
        # always()：前面的门红掉时更需要这份清单。
        if: always()
        run: python scripts/gk_sarif.py --out results.sarif --gate
      - name: upload SARIF to code scanning
        # report sink（报告出口），门禁在上一 step。fork PR 无 security-events 写权限
        # （平台限制），跳过而非判红；仓库未启用 code scanning / 启用了 CodeQL default
        # setup 时上传会被拒 —— 那是配置态，不该把全部 PR 判红。
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126  # v3.39.2
        with:
          sarif_file: results.sarif
          category: aegis-static
      - name: workflow lint (actionlint if present)
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            actionlint -color
          else
            echo "actionlint not installed — SKIP (not a pass)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: static-scan
          path: |
            static-scan.json
            results.sarif
          retention-days: 7
